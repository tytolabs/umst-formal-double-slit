# Coq/Rocq + Agda formal verification CI.
#
# Coq: the `rocq/rocq-prover:9.1` image's (same pin as umst-formal) ENTRYPOINT is `opam exec --`,
#       which fails under `--user root`. We clear the entrypoint and
#       dynamically find the opam bin directory to get `rocq compile`.
# Agda: pinned to Agda 2.8.0 (official Linux release binary) and standard-library 2.3, the versions the
#       proofs are developed against; Ubuntu's apt Agda (2.6.3) rejects modules that 2.8 accepts.
name: Formal (Coq + Agda)
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, master, docs/reorganize-readme]
    paths:
      - "Coq/**"
      - "Agda/**"
      - "Makefile"
      - "scripts/formal_check.sh"
      - ".github/workflows/formal.yml"
  pull_request:
    paths:
      - "Coq/**"
      - "Agda/**"
      - "Makefile"
      - "scripts/formal_check.sh"
      - ".github/workflows/formal.yml"

concurrency:
  # suffix keeps runs called from CI (ci.yml) from sharing, and cancelling, one group
  group: ${{ github.workflow }}-formal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coq:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.1
      options: --user root --entrypoint ""
    steps:
      - name: Install git
        run: |
          apt-get update -qq
          apt-get install -y -qq git
      - uses: actions/checkout@v4 # v4
      - name: coq-check (all Coq/ modules)
        run: |
          set -e
          ulimit -s unlimited
          export OCAMLRUNPARAM=s
          # Find the rocq binary — could be under /home/coq or /home/rocq
          ROCQ_BIN=""
          for d in /home/coq/.opam/*/bin /home/rocq/.opam/*/bin; do
            if [ -x "$d/rocq" ]; then
              ROCQ_BIN="$d"
              break
            fi
          done
          if [ -z "$ROCQ_BIN" ]; then
            echo "Searching entire filesystem for rocq..."
            ROCQ_PATH="$(find / -name rocq -type f 2>/dev/null | head -1)"
            if [ -n "$ROCQ_PATH" ]; then
              ROCQ_BIN="$(dirname "$ROCQ_PATH")"
            else
              echo "ERROR: rocq binary not found anywhere"
              ls -la /home/ 2>/dev/null || true
              exit 1
            fi
          fi
          export PATH="${ROCQ_BIN}:${PATH}"
          echo "Using rocq from: $ROCQ_BIN"
          rocq compile --version
          cd Coq
          # `Extraction.v` writes OCaml under `_extract/` — must exist (see root `Makefile` `coq-check`).
          mkdir -p _extract
          # Every tracked .v, under the logical mappings of _CoqProject (a hand-picked list let 122 files go unchecked).
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          grep -E '^-' _CoqProject > _CoqProject.all
          git -C .. ls-files 'Coq/*.v' 'Coq/**/*.v' | sed 's#^Coq/##' | sort -u >> _CoqProject.all
          echo "$(grep -c '\.v$' _CoqProject.all) Coq files"
          rocq makefile -f _CoqProject.all -o Makefile.all
          make -f Makefile.all -j2

  agda:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4 # v4
      - name: Install Agda 2.8.0 + standard-library 2.3 (pinned)
        run: |
          set -e
          mkdir -p "$HOME/agda-bin" "$HOME/agda-libs"
          curl -fsSL -o /tmp/agda.tar.xz https://github.com/agda/agda/releases/download/v2.8.0/Agda-v2.8.0-linux.tar.xz
          tar -xJf /tmp/agda.tar.xz -C "$HOME/agda-bin"
          AGDA=$(find "$HOME/agda-bin" -type f -name agda -perm -u+x | head -1)
          test -n "$AGDA"
          echo "$(dirname "$AGDA")" >> "$GITHUB_PATH"
          curl -fsSL -o /tmp/stdlib.tar.gz https://github.com/agda/agda-stdlib/archive/refs/tags/v2.3.tar.gz
          tar -xzf /tmp/stdlib.tar.gz -C "$HOME/agda-libs"
          mkdir -p ~/.agda
          echo "$HOME/agda-libs/agda-stdlib-2.3/standard-library.agda-lib" > ~/.agda/libraries
          echo "standard-library" > ~/.agda/defaults
          "$AGDA" --version
      - name: agda-check (all Agda/ modules)
        run: |
          set -e
          cd Agda
          # Every tracked .agda (a hand-picked list let 124 files go unchecked).
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          files=$(git -C .. ls-files 'Agda/*.agda' 'Agda/**/*.agda' | sed 's#^Agda/##' | sort -u)
          echo "$(echo "$files" | wc -l) Agda files"
          for f in $files; do
            echo "==> Checking $f"
            agda "$f"
          done
