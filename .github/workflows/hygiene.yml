# Repository hygiene on every push: no tracked build artefacts, and the formal gaps inventory matches the sources.
name: Hygiene
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - name: No ignored build artefacts are tracked
        # A committed build product (.olean, .agdai, .vo, .lake packages) is loaded instead of rebuilt and
        # breaks CI when it was compiled with another toolchain.
        run: |
          set -euo pipefail
          bad=$(git ls-files -ci --exclude-standard)
          if [ -n "$bad" ]; then
            echo "FAIL: files matched by .gitignore are tracked:"
            echo "$bad" | head -50
            exit 1
          fi
          echo "OK: no tracked build artefacts"
      - name: Formal gaps inventory matches the sources (P0-7)
        # Fails on any Coq Axiom/Parameter, Agda postulate block or Lean native_decide site that the committed
        # FORMAL_GAPS.json does not list; regenerate with `python3 scripts/formal_gaps.py --emit FORMAL_GAPS.json`.
        run: python3 scripts/formal_gaps.py --check FORMAL_GAPS.json

      - name: Constants modules and README table match constants/constants.json
        run: python3 scripts/gen_constants.py --check

      - name: Ground-state modules match chemistry/ground_states.json (cited NIST data)
        run: python3 scripts/gen_ground_states.py --check

      - name: Four-language parity of the contract (formal_parity.json)
        run: python3 scripts/check_formal_parity.py --summary

      - name: Wording matches the formal state (no axiom; physicalSecondLaw is the erase instance)
        run: python3 scripts/check_stale_wording.py

      - name: README census and four-language matrix match the sources
        run: python3 scripts/gen_readme_blocks.py --check

      - name: No theatre in the Lean tree (literal, reflexive, alias, duplicate or bundle statements)
        # A ratchet that only falls; scripts/theatre_census.py --json lists any declaration it finds.
        run: python3 scripts/theatre_census.py --check 0
