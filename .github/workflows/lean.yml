# CI: Lake + Mathlib (cache when available). See Lean/VERIFY.md.
name: Lean
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, master, docs/reorganize-readme]
    paths:
      - "Lean/**"
      - "sim/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/lean.yml"
  pull_request:
    paths:
      - "Lean/**"
      - "sim/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/lean.yml"

concurrency:
  # suffix keeps runs called from CI (ci.yml) from sharing, and cancelling, one group
  group: ${{ github.workflow }}-lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lean
    steps:
      - uses: actions/checkout@v4 # v4

      - name: Install Elan
        run: |
          set -e
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Cache dependencies only (mathlib, umst-formal, …), keyed on the exact pins. The project's own proofs are never
      # restored from a cache: every run recompiles them, so a green run means every module checks now.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Lean/.lake/packages
          key: lake-packages-${{ runner.os }}-${{ hashFiles('Lean/lean-toolchain', 'Lean/lake-manifest.json') }}

      - name: Every tracked Lean file is compiled by a default target (or listed with a reason)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check_lean_ci_closure.py

      - name: Mathlib cache + build every library (zero errors, warnings, sorry; manifest current)
        run: |
          set -eo pipefail
          lake exe cache get || true
          lake build 2>&1 | tee lake-build.log
          if grep -q "manifest out of date" lake-build.log; then
            echo "FAIL: lakefile and lake-manifest.json disagree on a dependency revision"; exit 1
          fi
          project=$(grep -E "^(warning|error): " lake-build.log | grep -v "\.lake/packages" | grep -v "has local changes" || true)
          if [ -n "$project" ]; then
            echo "FAIL: project diagnostics (zero warnings is the bar):"; echo "$project"; exit 1
          fi
          if grep -q "declaration uses 'sorry'" lake-build.log; then
            echo "FAIL: sorry in a project module"; exit 1
          fi

      - name: Install Optional Sim Dependencies
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          python3 -m pip install -r sim/requirements-optional.txt

      - name: Python sim + tests
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          python3 sim/toy_double_slit_mi_gate.py --validate
          python3 sim/plot_toy_complementarity_svg.py --validate
          python3 sim/qubit_kraus_sweep.py --validate
          python3 sim/plot_complementarity_svg.py --validate
          python3 -m unittest discover -s sim/tests -p "test_*.py"
          python3 scripts/generate_sim_gifs.py --validate

      - name: Telemetry consumer validation
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          python3 sim/telemetry_trace_consumer.py /dev/null --validate
          python3 sim/export_sample_telemetry_trace.py --validate


