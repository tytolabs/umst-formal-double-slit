# Haskell QuickCheck mirror — see Haskell/README.md
name: Haskell
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, master, docs/reorganize-readme]
    paths:
      - "Haskell/**"
      - ".github/workflows/haskell.yml"
  pull_request:
    paths:
      - "Haskell/**"
      - ".github/workflows/haskell.yml"

concurrency:
  # suffix keeps runs called from CI (ci.yml) from sharing, and cancelling, one group
  group: ${{ github.workflow }}-haskell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cabal-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Haskell
    steps:
      - uses: actions/checkout@v4 # v4

      - uses: haskell-actions/setup@cd0d9bdd65b20557f41bea4dbe43d0b5fbbfe553 # v2
        with:
          ghc-version: "9.14"
          cabal-version: "3.16"

      - name: Cache Cabal store + dist-newstyle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cabal/store
            ~/.cabal/packages
            Haskell/dist-newstyle
          key: ${{ runner.os }}-haskell-ghc914-${{ hashFiles('Haskell/umst-formal-double-slit.cabal', 'Haskell/cabal.project', 'Haskell/cabal.project.freeze', 'Haskell/**/*.hs') }}
          restore-keys: |
            ${{ runner.os }}-haskell-ghc914-

      - name: Build and test
        run: |
          set -e
          cabal update
          cabal test

      # The cabal package lists 30 modules; the four-language mirrors under Haskell/UMST/ and the root/legacy files
      # are not in it, so without this step 112 tracked .hs files would pass CI unchecked.
      - name: Typecheck every tracked .hs outside the cabal package
        run: |
          set -e
          files=$(git ls-files '*.hs' | grep -v -E '^(src|app|test)/')
          echo "$(echo "$files" | wc -l) files"
          cabal exec -- ghc --make -fno-code -i. -isrc -outputdir /tmp/ghc-typecheck $files
